<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A self-hosted board should not be indexable by default; the real
         decision belongs with deployment, but the safe default is here. -->
    <meta name="robots" content="noindex" />
    <!-- The brand mark (LAI-1126), served from our own origin: the CSP is
         'self' only, and the flat mark is the one that holds at 16px. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Laika</title>
    <!-- The stored theme and font on <html> before the first paint (LAI-1212).
         A classic same-origin script, not inline — the CSP forbids inline —
         and not a module, because modules are deferred past first paint. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <!--
      The startup splash (LAI-1126). Plain markup, no inline <script> or
      <style> — the CSP allows neither — styled by `brand.css`, which reaches
      this page through the stylesheet Vite links from <head>. It is inside
      #root on purpose: React's first render replaces it, so it is gone the
      moment the app can paint, with no timer and no minimum duration.
      `BrandSplash.tsx` is the same picture; the geometry is checked against
      `brand-paths.ts` by test/components/brand/brand.test.ts.
    -->
    <div id="root">
      <div class="brand-splash" role="status" aria-label="Loading Laika" data-boot-splash>
        <div class="brand-splash-panel">
          <span
            class="brand-lockup brand-lockup-xl brand-splash-lockup"
            role="img"
            aria-label="Laika"
          >
            <svg
              class="brand-mark brand-mark-full"
              width="56"
              height="56"
              viewBox="0 0 64 64"
              fill="none"
              stroke-linejoin="round"
              stroke-linecap="round"
              focusable="false"
              aria-hidden="true"
            >
              <defs>
                <linearGradient
                  id="laika-boot-glass"
                  gradientUnits="userSpaceOnUse"
                  x1="12"
                  y1="6"
                  x2="58"
                  y2="58"
                >
                  <stop offset="0" class="brand-stop-1" />
                  <stop offset="0.55" class="brand-stop-2" />
                  <stop offset="1" class="brand-stop-3" />
                </linearGradient>
              </defs>
              <g class="brand-mark-slab">
                <path
                  d="M17 44H55L52 53H14Z"
                  fill="url(#laika-boot-glass)"
                  stroke="url(#laika-boot-glass)"
                  stroke-width="8"
                />
              </g>
              <path
                class="brand-mark-fold"
                d="M25 9H37L27 47H15Z"
                transform="translate(1.6 1.6)"
                stroke-width="8"
              />
              <g class="brand-mark-slab">
                <path
                  d="M25 9H37L27 47H15Z"
                  fill="url(#laika-boot-glass)"
                  stroke="url(#laika-boot-glass)"
                  stroke-width="8"
                />
              </g>
              <g class="brand-mark-rim" stroke-width="1.3">
                <path d="M24.6 12.5L17.4 41" />
                <path d="M20 41.6H53" />
              </g>
            </svg>
            <span class="brand-wordmark">
              <svg
                width="85"
                height="32"
                viewBox="0 0 85 32"
                fill="none"
                stroke="currentColor"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
                focusable="false"
                aria-hidden="true"
              >
                <path d="M5 6.5V25.5H15" />
                <path d="M32.5 15.5V25.5" />
                <path d="M42 15.5V25.5" />
                <path d="M51.5 6.5V25.5" />
                <path d="M61 15.5L54 21" />
                <path d="M56.5 19.5L62 25.5" />
                <path d="M80 15.5V25.5" />
                <circle cx="27.5" cy="20.5" r="5" />
                <circle cx="75" cy="20.5" r="5" />
                <circle class="brand-wordmark-dot" cx="42" cy="7.5" r="3.1" stroke="none" />
              </svg>
              <span class="visually-hidden">Laika</span>
            </span>
          </span>
          <p class="brand-splash-tagline" aria-hidden="true">PLAN • COLLABORATE • DELIVER</p>
          <div class="brand-splash-steps" aria-hidden="true">
            <span class="brand-splash-step"></span>
            <span class="brand-splash-step"></span>
            <span class="brand-splash-step"></span>
            <span class="brand-splash-step"></span>
          </div>
        </div>
        <span class="visually-hidden">Loading Laika</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
