# A push to master is a release (LAI-714, D-073).
#
# What runs where (LAI-990):
#
#   push to master                           gate, then build and deploy
#   push to integration-*                    gate only
#   pull request into master/integration-*   gate only, never a deploy
#   workflow_dispatch, any branch            gate only, never a deploy
#
# A push to any other branch runs nothing; a pull request from it into master
# or an integration-* branch runs the gate.
# On master, a green gate builds the arm64 image, points `latest` at it and
# restarts production on that exact digest; a deploy that does not come up
# healthy is rolled back to the image it replaced, and the run goes red.
name: CI / Deploy

on:
  push:
    branches: [master, 'integration-*']
  pull_request:
    branches: [master, 'integration-*']
  workflow_dispatch:

# One deploy at a time on master. A push that lands mid-deploy waits, and a
# newer push replaces an older one that is still waiting — only the newest
# commit goes live; a deploy is never cut off. Everything else gets a group per
# pull request or per branch, never waits on master, and a newer run cancels
# the older one still in progress.
concurrency:
  group: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'production' || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::926583575159:role/laika-github-deploy
  ECR_REGISTRY: 926583575159.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: laika
  INSTANCE_ID: i-0b2fa45c15e1b10cf

jobs:
  # The gate is split across parallel jobs (LAI-1030): one runner doing lint,
  # format and three test suites one after another took ~25-42 minutes. Each
  # test job runs its package's own `test` script, typecheck included, so what
  # CI runs is still what `pnpm test` runs; the big suites are sharded by file.
  lint:
    name: Gate · lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Two steps, two exit codes — the rule in CLAUDE.md §5, kept here.
      - name: Lint
        # Type-aware eslint outgrows Node's default ~2 GB heap (LAI-574).
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm lint
      - name: Format
        run: pnpm format

  server:
    name: Gate · server ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `typecheck && vitest run --shard=N/4`: vitest splits the files.
      - name: Test
        working-directory: server
        run: pnpm run test --shard=${{ matrix.shard }}/4

  web:
    name: Gate · web ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @laika/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium for the browser tests
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @laika/web exec playwright install --with-deps chromium
      - name: Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @laika/web exec playwright install-deps chromium
      # The package script is `typecheck && node --test "test/**/*.test.ts"`.
      # Arguments after the glob would reach the tests, not node, so the shard
      # goes in through NODE_OPTIONS; node splits the sorted file list.
      - name: Test
        working-directory: server/web
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/4
        run: pnpm run test

  cli:
    name: Gate · cli
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: cli
        run: pnpm run test

  # The one check that means "the gate is green", and the one deploy needs.
  # `always()` matters: without it a failed shard would leave this job
  # *skipped*, and a skipped check reads as passing. It runs and goes red.
  gate:
    name: Gate — test, lint, format
    if: always()
    needs: [lint, server, web, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Every gate job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'length == 4 and all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null

  build:
    name: Build — arm64 image
    # A push to master only: a pull request, even one from master, never deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      # Built on an arm64 runner, so the image is native to the t4g instance —
      # no emulation. Tagged with the commit; `latest` moves only after the
      # gate is green too, in the deploy job.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy — production
    needs: [gate, build]
    # A push to master only: a pull request, even one from master, never deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Point latest at this build
        id: tag
        run: |
          set -euo pipefail
          latest() {
            aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag=latest --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true
          }
          previous="$(latest)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "previous: ${previous:-none}"
          if [ "$previous" != "$DIGEST" ]; then
            manifest="$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
              --image-ids imageDigest="$DIGEST" --query 'images[0].imageManifest' --output text)"
            aws ecr put-image --repository-name "$ECR_REPOSITORY" --image-tag latest \
              --image-manifest "$manifest" > /dev/null
          fi
          now="$(latest)"
          if [ "$now" != "$DIGEST" ]; then
            echo "::error::latest is $now, expected $DIGEST"
            exit 1
          fi
          echo "latest: $now"

      - name: Restart production and check it
        run: .github/deploy/deploy.sh "$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST"

      # Only after a deploy that came up healthy (LAI-720). Everything but the
      # live image goes: it is the last successful one, so it is also what the
      # next failed deploy rolls back to. A failed deploy skips this step and
      # keeps the image its rollback needs.
      - name: Remove every image but the live one
        run: |
          set -euo pipefail
          manifest="$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageDigest="$DIGEST" --query 'images[0].imageManifest' --output text)"
          # A multi-platform or attested image is an index; its parts stay with it.
          keep="$(printf '%s\n%s\n' "$DIGEST" "$(jq -r '.manifests[]?.digest' <<<"$manifest")" | grep . | sort -u)"
          doomed() {
            aws ecr list-images --repository-name "$ECR_REPOSITORY" \
              --query 'imageIds[].imageDigest' --output text | tr '\t' '\n' | grep . | sort -u |
              grep -vxF -f <(printf '%s\n' "$keep") || true
          }
          # In passes: ECR refuses to delete a part while its index still exists.
          for _ in 1 2 3; do
            mapfile -t gone < <(doomed)
            [ "${#gone[@]}" -eq 0 ] && break
            for ((i = 0; i < ${#gone[@]}; i += 100)); do
              ids=()
              for d in "${gone[@]:i:100}"; do ids+=("imageDigest=$d"); done
              aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" \
                --image-ids "${ids[@]}" --query 'length(imageIds)' --output text |
                sed 's/^/deleted: /'
            done
          done
          left="$(aws ecr list-images --repository-name "$ECR_REPOSITORY" \
            --query 'imageIds[].imageDigest' --output text | tr '\t' '\n' | grep . | sort -u | wc -l)"
          echo "images left in ECR: $left (live $DIGEST)"

      - name: Roll back to the image this replaced
        if: failure() && steps.tag.outputs.previous != '' && steps.tag.outputs.previous != 'None' && steps.tag.outputs.previous != env.DIGEST
        env:
          PREVIOUS: ${{ steps.tag.outputs.previous }}
        run: |
          set -euo pipefail
          echo "::warning::rolling production back to $PREVIOUS"
          manifest="$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageDigest="$PREVIOUS" --query 'images[0].imageManifest' --output text)"
          aws ecr put-image --repository-name "$ECR_REPOSITORY" --image-tag latest \
            --image-manifest "$manifest" > /dev/null || true
          .github/deploy/deploy.sh "$ECR_REGISTRY/$ECR_REPOSITORY@$PREVIOUS"
