AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Laika (LAI-714) - lets GitHub Actions on the master branch of PawanSirsat/Laika
  push the image to ECR and restart the production instance over SSM, through
  OIDC. No long-lived keys exist anywhere.

Parameters:
  GitHubRepository:
    Type: String
    Default: PawanSirsat/Laika
    Description: owner/name of the repository whose workflows may deploy.
  Branch:
    Type: String
    Default: master
    Description: The only branch whose runs may assume the role.
  EcrRepositoryName:
    Type: String
    Default: laika
  InstanceId:
    Type: String
    Default: i-0b2fa45c15e1b10cf
    Description: The production instance the role may restart.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates GitHub's certificate itself now; the thumbprints are
      # still accepted and kept for older SDKs that read them.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: laika-github-deploy
      Description: Assumed by GitHub Actions on master to push the Laika image and restart production.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # One repository, one branch. A run on any other branch, a
                # fork or a pull request cannot assume this role.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/${Branch}
      Policies:
        - PolicyName: push-image
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Login
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushAndTag
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}
        - PolicyName: restart-instance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RunOnTheOneInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: ReadTheResult
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: '*'
              - Sid: FindThePublicAddress
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'

Outputs:
  RoleArn:
    Description: Set as AWS_ROLE_ARN in .github/workflows/deploy.yml.
    Value: !GetAtt DeployRole.Arn
