# Laika's response headers for the web-serve image (LAI-1308), copied from the
# server's: server/src/http/middleware/security-headers.ts, and the CSP from
# buildContentSecurityPolicy in server/src/http/security-headers.ts with no
# style hashes (SPEC §13.1). server/test/tooling/web-serve.test.ts holds every
# name and value here to the middleware's.
#
# Included in the server block and again in every location that sets a header
# of its own: nginx drops the outer add_header lines from any block that has
# one, so a location without this include would answer without them.
#
# `always` puts them on 404s too, as the server does on its errors. HSTS is
# unconditional, unlike the server's: the proxy in front terminates TLS, and a
# browser ignores the header on a plain-HTTP response anyway.
#
# $laika_store_sources is the attachment store's origin with a space in front,
# or nothing; default.conf.template maps it from LAIKA_STORAGE_ORIGIN.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:$laika_store_sources; media-src 'self'$laika_store_sources; font-src 'self'; connect-src 'self'$laika_store_sources; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
