# Laika — one service, one volume. `docker compose up --build` from docker/.
#
# Secrets come from the environment, never from this file. Copy env.example to
# .env next to this file and put LAIKA_SECRET there; .env is gitignored.

services:
  laika:
    build:
      # The build needs server/, so the context is the repo root and the
      # Dockerfile is addressed from there. Ignore rules live in
      # docker/Dockerfile.dockerignore.
      context: ..
      dockerfile: docker/Dockerfile
    image: laika:local
    container_name: laika
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: '3000'
      # The database must resolve inside the volume. Overriding this to a path
      # outside /data puts the database somewhere backups will not find it.
      LAIKA_DB_PATH: /data/laika.db
      # Required. No default on purpose — the container refuses to start
      # without it rather than inventing a throwaway key on every boot.
      LAIKA_SECRET: ${LAIKA_SECRET:?set LAIKA_SECRET in docker/.env — copy docker/env.example}
      # Required, and deliberately not defaulted even though a default would
      # "work" locally. It is pasted into invite links and webhook URLs, so a
      # value that quietly points at localhost in production fails as a mail
      # problem days later rather than as a startup error now.
      LAIKA_PUBLIC_URL: ${LAIKA_PUBLIC_URL:?set LAIKA_PUBLIC_URL in docker/.env — the URL your users type, e.g. https://laika.example.com}

    ports:
      - '${LAIKA_PORT:-3000}:3000'

    volumes:
      # The entire backup story: stop the container, copy this volume.
      - laika-data:/data

    # No `init: true` here. The image already runs tini as its entrypoint;
    # adding compose's init puts a second init at PID 1 and demotes tini to a
    # child, which makes it log that subreaping is disabled and does nothing
    # useful. One init, and it is the image's.

    # The image declares its own HEALTHCHECK; compose inherits it. Repeated
    # here only to give `depends_on: condition: service_healthy` a contract
    # that does not silently change with the base image.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch(`http://127.0.0.1:$${process.env.PORT||3000}/api/v1/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    security_opt:
      - no-new-privileges:true

volumes:
  laika-data:
