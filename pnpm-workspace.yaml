packages:
  - server
  # server/web/ is the SPA and belongs to Builder-B (D-016). pnpm matches these
  # entries exactly, so `- server` does not cover it. Listed before the package
  # exists (LAI-017) — pnpm ignores an entry that matches nothing — so adding
  # server/web/package.json is a change inside server/web/ and never an edit to
  # this root file.
  - server/web
  # cli/ has no package.json yet (Builder-B, LAI-0xx). Listed now so adding one
  # is a change inside cli/ and never an edit to this root file.
  - cli

# esbuild ships a prebuilt platform binary and needs its install script to run.
# Listing it explicitly keeps pnpm 10 from blocking it (and from warning on
# every install) without opening the door to arbitrary postinstall scripts.
onlyBuiltDependencies:
  - esbuild
